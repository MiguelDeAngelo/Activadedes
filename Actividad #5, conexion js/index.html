<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de Registro de Usuario</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .form-container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #555;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #007bff;
      outline: none;
    }

    .form-group i {
      position: absolute;
      right: 15px;
      top: 38px;
      color: #888;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .note {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Formulario de Registro</h2>
    <form id="registroForm">
      
      <div class="form-group">
        <label for="id">Número de Identificación</label>
        <input type="text" id="id" name="id" placeholder="Ej: 123456789" required>
        <i class="fas fa-id-card"></i>
      </div>

      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej: juanperez" required>
        <i class="fas fa-user"></i>
      </div>

      <div class="form-group">
        <label for="password">Clave</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
        <i class="fas fa-lock"></i>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        <i class="fas fa-envelope"></i>
      </div>

      <div class="form-group">
        <label for="role">Rol del Usuario</label>
        <select id="role" name="role" required>
          <option value="">-- Seleccione un rol --</option>
          <option value="usuario">Usuario</option>
          <option value="administrador">Administrador</option>
          <option value="superadministrador">Superadministrador</option>
        </select>
        <i class="fas fa-user-tag"></i>
      </div>

      <button type="submit">Registrar Usuario</button>
    </form>
    <div class="note">Todos los campos son obligatorios</div>
  </div>

  <script>
    document.getElementById("registroForm").addEventListener("submit", function(e) {
      e.preventDefault(); // Evita envío real

      const id = document.getElementById("id").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const email = document.getElementById("email").value;
      const role = document.getElementById("role").value;

      const datos = `ID: ${id}\nUsuario: ${username}\nClave: ${password}\nEmail: ${email}\nRol: ${role}\n\n`;

      // Simulación de guardado local
      let registros = localStorage.getItem("usuarios") || "";
      registros += datos;
      localStorage.setItem("usuarios", registros);

      alert("Datos registrados (simulados como si fueran guardados en un archivo TXT)");

      this.reset(); // Limpia el formulario
    });
  </script>

</body>
</html>
