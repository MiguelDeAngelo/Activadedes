<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login del Terror</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #000000, #1a1a1a);
      height: 100vh;
      font-family: 'Creepster', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff4444;
      overflow: hidden;
    }
    .fog {
      position: absolute;
      width: 200%;
      height: 200%;
      background: url('https://www.transparenttextures.com/patterns/fog.png');
      animation: fogAnim 60s linear infinite;
      opacity: 0.1;
      z-index: 0;
    }
    @keyframes fogAnim {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }
    .login-box {
      position: relative;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border: 2px solid #ff4444;
      border-radius: 10px;
      box-shadow: 0 0 20px red;
      z-index: 1;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
    }
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #1a1a1a;
      border: 1px solid #ff4444;
      color: #ff4444;
      font-size: 1.2rem;
    }
    button {
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #ff0000;
      color: black;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #aa0000;
      color: white;
      transform: scale(1.05);
    }
    .toggle-link {
      display: block;
      margin-top: 15px;
      color: #ff4444;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="fog"></div>
  <div class="login-box">
    <h1 id="form-title">Inicia Sesión... si te atreves</h1>
    <form id="loginForm">
      <input type="text" placeholder="Nombre maldito" required>
      <input type="password" placeholder="Contraseña oscura" required>
      <button type="submit">Entrar al abismo</button>
    </form>

    <form id="registerForm" style="display: none;">
      <input type="text" placeholder="Nuevo nombre" required>
      <input type="email" placeholder="Correo infernal" required>
      <input type="password" placeholder="Contraseña eterna" required>
      <button type="submit">Registrarse en el infierno</button>
    </form>

    <span class="toggle-link" id="toggleForm">¿No tienes cuenta? Regístrate</span>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('form-title');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      alert('El abismo te da la bienvenida...');
    });

    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Tu alma ha sido registrada...');
    });

    toggleForm.addEventListener('click', () => {
      const isLoginVisible = loginForm.style.display !== 'none';
      loginForm.style.display = isLoginVisible ? 'none' : 'block';
      registerForm.style.display = isLoginVisible ? 'block' : 'none';
      formTitle.textContent = isLoginVisible ? 'Únete... para siempre' : 'Inicia Sesión... si te atreves';
      toggleForm.textContent = isLoginVisible ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
    });
  </script>
</body>
</html>
